services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: subtitle_studio
      POSTGRES_USER: subtitle_studio
      POSTGRES_PASSWORD: subtitle_studio
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - DATABASE_URL=postgresql+psycopg2://subtitle_studio:subtitle_studio@postgres:5432/subtitle_studio
      - REDIS_URL=redis://redis:6379/0
      - EXECUTION_MODE=${EXECUTION_MODE:-CLOUD_FREE_API}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: celery -A worker.jobs.celery_app worker --loglevel=info --concurrency=1
    environment:
      - DATABASE_URL=postgresql+psycopg2://subtitle_studio:subtitle_studio@postgres:5432/subtitle_studio
      - REDIS_URL=redis://redis:6379/0
      - EXECUTION_MODE=${EXECUTION_MODE:-CLOUD_FREE_API}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
